[project]
name = "korone"
version = "0.0.1"
description = "An all-in-one bot for Telegram"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Hitalo M." }]
requires-python = ">=3.14"
dependencies = [
    "aiogram>=3.31.0,<4",
    "aiofiles>=25.1.0",
    "redis>=8.1.0",
    "alembic>=1.20.0",
    "sqlalchemy[asyncio]>=2.1.4",
    "asyncpg>=0.32.0",
    "Babel>=2.18.0",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0,<3",
    "structlog>=26.1.0",
    "uvloop>=0.23.0",
    "aiohttp[speedups]>=3.14.4",
    "lxml>=6.1.3",
    "pillow>=12.3.0",
    "polib>=1.2.0",
    "orjson>=3.13.0",
    "sentry-sdk>=2.71.0",
    "url-normalize>=3.0.1",
    "argon2-cffi>=25.1.0",
]

[dependency-groups]
dev = ["pre-commit>=4.6.2", "ruff>=0.16.10", "pyright>=1.1.414"]

[tool.pyright]
venv = ".venv"
venvPath = "."

[build-system]
requires = ["uv_build>=0.12.24,<0.13"]
build-backend = "uv_build"
