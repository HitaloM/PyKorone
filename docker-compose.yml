services:
  telegram-bot-api:
    image: docker.io/aiogram/telegram-bot-api:latest
    env_file:
      - data/docker.env
    environment:
      TELEGRAM_LOCAL: "1"
    volumes:
      - telegram_bot_api_data:/var/lib/telegram-bot-api:z
      - telegram_uploads:/var/lib/telegram-bot-api/korone-uploads:ro,z
    depends_on:
      telegram-upload-init:
        condition: service_completed_successfully
    restart: unless-stopped

  postgres:
    image: docker.io/library/postgres:18
    environment:
      POSTGRES_DB: korone
      POSTGRES_USER: korone
      POSTGRES_PASSWORD: korone
    volumes:
      - postgres_data:/var/lib/postgresql
    restart: unless-stopped

  redis:
    image: docker.io/library/redis:8
    restart: unless-stopped

  korone-bot:
    build: .
    user: "101:101"
    env_file:
      - data/config.env
    environment:
      DB_URL: postgresql+asyncpg://korone:korone@postgres:5432/korone
      KORONE_PROJECT_ROOT: /app
      REDIS_HOST: redis
      REDIS_PORT: 6379
      BOTAPI_SERVER: http://telegram-bot-api:8081
      BOTAPI_UPLOAD_ROOT: /var/lib/telegram-bot-api/korone-uploads
      WEB_SERVER_PORT: 9669
    depends_on:
      telegram-bot-api:
        condition: service_started
      telegram-upload-init:
        condition: service_completed_successfully
      postgres:
        condition: service_started
      redis:
        condition: service_started
    volumes:
      - telegram_bot_api_data:/var/lib/telegram-bot-api:ro,z
      - telegram_uploads:/var/lib/telegram-bot-api/korone-uploads:z
    restart: unless-stopped

  telegram-upload-init:
    image: docker.io/aiogram/telegram-bot-api:latest
    user: "0:0"
    entrypoint: ["sh", "-c"]
    command: ["chown 101:101 /uploads && chmod 700 /uploads"]
    volumes:
      - telegram_uploads:/uploads:z
    restart: "no"

  tunnel:
    image: docker.io/cloudflare/cloudflared:latest
    profiles: ["tunnel"]
    restart: unless-stopped
    env_file:
      - data/docker.env
    command: tunnel run
    depends_on:
      - korone-bot

volumes:
  postgres_data:
  telegram_bot_api_data:
  telegram_uploads:
